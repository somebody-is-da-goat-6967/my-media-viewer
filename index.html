<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Random Media</title>
  <style>
    html, body { height: 100%; }
    body { margin: 0; background: #111; display: flex; flex-direction: column;
           align-items: center; justify-content: center; font-family: sans-serif; }
    #stage { flex: 1; display: flex; align-items: center; justify-content: center;
             width: 100%; min-height: 0; }
    #stage img, #stage video { max-width: 100%; max-height: 100%; object-fit: contain; }
    button { margin: 12px; padding: 10px 24px; font-size: 16px; cursor: pointer; }
  </style>
</head>
<body>
  <div id="stage"></div>
  <button id="next">Another</button>
  <script>
    let files = [];
    const stage = document.getElementById('stage');
    const isVideo = u => /\.(mp4|webm|mov|m4v)$/i.test(u);

    function show() {
      if (!files.length) return;
      const url = files[Math.floor(Math.random() * files.length)];
      stage.innerHTML = '';
      const el = document.createElement(isVideo(url) ? 'video' : 'img');
      el.src = url;
      if (isVideo(url)) { el.controls = true; el.autoplay = true; el.muted = true; el.loop = true; }
      stage.appendChild(el);
    }

    fetch('manifest.json').then(r => r.json()).then(j => { files = j; show(); });
    document.getElementById('next').onclick = show;
  </script>
</body>
</html>

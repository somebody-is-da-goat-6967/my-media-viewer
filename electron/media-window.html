<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Media</title>
<style>
  * { box-sizing: border-box; }
  html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #08090b; color: #f2f1ed; font: 13px/1.4 system-ui, sans-serif; }
  body { position: relative; }
  header { position: absolute; z-index: 3; inset: 0 0 auto; min-height: 42px; padding: 5px 10px; display: flex; align-items: center; gap: 10px; overflow: hidden; background: rgba(23,25,29,.9); color: #aeb2bb; -webkit-app-region: drag; opacity: 0; pointer-events: none; transition: opacity .16s ease; }
  body:hover header, body:focus-within header { opacity: 1; pointer-events: auto; }
  #name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #loopControl { display: none; align-items: center; gap: 5px; white-space: nowrap; }
  button { -webkit-app-region: no-drag; border: 1px solid #363a43; border-radius: 6px; padding: 5px 11px; background: #22252b; color: #fff; cursor: pointer; }
  main { position: absolute; inset: 0; min-width: 0; min-height: 0; overflow: hidden; display: grid; place-items: center; }
  img, video { display: block; min-width: 0; min-height: 0; width: 100%; height: 100%; max-width: 100%; max-height: 100%; object-fit: contain; background: #050607; }
</style>
</head>
<body>
  <header><strong id="name"></strong><label id="loopControl"><input id="loop" type="checkbox">Loop</label><button id="next" hidden type="button">Next</button><button id="close" type="button" title="Close window">×</button></header>
  <main id="media"></main>
  <script>
    const params = new URLSearchParams(location.search);
    const type = params.get('type');
    const src = params.get('src');
    const name = params.get('name') || 'Media';
    let playlist = [];
    let index = Math.max(0, Number(params.get('index')) || 0);
    const step = Math.max(1, Number(params.get('step')) || 1);
    const imageName = document.querySelector('#name');
    const imageAutoplay = { enabled: params.get('autoplay') === 'true', random: params.get('random') === 'true', interval: Math.max(3, Number(params.get('interval')) || 5) };
    let imageTimer = null;
    let scheduleImageAdvance = () => {};
    window.mediaViewerSetPlaylist = entries => {
      playlist = Array.isArray(entries) ? entries.map(value => typeof value === 'string' ? { src: value, name: '' } : value).filter(value => typeof value?.src === 'string') : [];
      document.querySelector('#next').hidden = playlist.length < 2;
      scheduleImageAdvance();
    };
    window.mediaViewerSetAutoplay = config => {
      imageAutoplay.enabled = !!config?.enabled;
      imageAutoplay.random = !!config?.random;
      imageAutoplay.interval = Math.max(3, Number(config?.interval) || 5);
      scheduleImageAdvance();
    };
    document.title = name;
    imageName.textContent = name;
    document.querySelector('#close').addEventListener('click', () => window.close());
    const el = document.createElement(type === 'video' ? 'video' : 'img');
    el.src = src || '';
    if (type === 'video') {
      const loopControl = document.querySelector('#loopControl');
      const loop = document.querySelector('#loop');
      const next = document.querySelector('#next');
      loopControl.style.display = 'flex';
      next.hidden = true;
      el.controls = true; el.autoplay = true; el.playsInline = true; el.muted = true;
      el.loop = false;
      const advance = () => {
        if (playlist.length < 2) return;
        index = (index + step) % playlist.length;
        el.src = playlist[index].src; el.load(); el.play().catch(() => {});
        imageName.textContent = playlist[index].name || name;
        document.title = imageName.textContent;
      };
      loop.addEventListener('change', () => { el.loop = loop.checked; });
      next.addEventListener('click', advance);
      el.addEventListener('ended', advance);
      el.addEventListener('canplay', () => el.play().catch(() => {}), { once: true });
      el.addEventListener('loadedmetadata', () => {
        el.style.aspectRatio = `${el.videoWidth} / ${el.videoHeight}`;
        el.style.objectFit = 'contain';
      });
    } else {
      el.alt = name;
      scheduleImageAdvance = () => {
        clearTimeout(imageTimer);
        if (imageAutoplay.enabled && playlist.length > 1) imageTimer = setTimeout(advanceImage, imageAutoplay.interval * 1000);
      };
      function advanceImage() {
        if (playlist.length < 2) return;
        if (imageAutoplay.random) {
          const previous = index;
          do { index = Math.floor(Math.random() * playlist.length); } while (playlist.length > 1 && index === previous);
        } else index = (index + step) % playlist.length;
        const entry = playlist[index];
        el.src = entry.src; el.alt = entry.name || name;
        imageName.textContent = entry.name || name;
        document.title = imageName.textContent;
        scheduleImageAdvance();
      }
      el.addEventListener('load', scheduleImageAdvance);
      el.addEventListener('error', scheduleImageAdvance);
    }
    document.querySelector('#media').append(el);
    if (window.mediaViewerDesktop?.onMediaAutoplay) window.mediaViewerDesktop.onMediaAutoplay(window.mediaViewerSetAutoplay);
    if (window.mediaViewerDesktop?.onMediaPlaylist) window.mediaViewerDesktop.onMediaPlaylist(window.mediaViewerSetPlaylist);
  </script>
</body>
</html>
